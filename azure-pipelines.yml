trigger:
- main

pool:
  vmImage: 'ubuntu-latest' # Linux agent with .NET SDK pre-installed

variables:
  buildConfiguration: 'Release'

jobs:
- job: TestAndPackageDotNet
  displayName: 'Test, Build, and Package .NET Site'
  steps:
  
  # 1. Install/Verify .NET SDK Version
  - task: UseDotNet@2
    displayName: 'Ensure .NET SDK 8.x is installed'
    inputs:
      version: '8.x' # Update to 6.x, 7.x, or 9.x depending on your app

  # 2. Restore NuGet Dependencies
  - task: DotNetCoreCLI@2
    displayName: 'Restore NuGet Packages'
    inputs:
      command: 'restore'
      projects: '**/*.csproj'

  # 3. Compile the Code
  - task: DotNetCoreCLI@2
    displayName: 'Build .NET Web App'
    inputs:
      command: 'build'
      projects: '**/*.csproj'
      arguments: '--configuration $(buildConfiguration)'

  # 4. Run Unit Tests (Crucial Deployment Test step)
  - task: DotNetCoreCLI@2
    displayName: 'Run Unit Tests'
    inputs:
      command: 'test'
      projects: '**/*[Tt]est*/*.csproj' # Finds any project file with "test" in the name
      arguments: '--configuration $(buildConfiguration)'

  # 5. Publish / Compile Site for Production
  - task: DotNetCoreCLI@2
    displayName: 'Publish Web App Files'
    inputs:
      command: 'publish'
      publishWebProjects: true # Automatically finds and bundles your main web project
      arguments: '--configuration $(buildConfiguration) --output $(Build.BinariesDirectory)/zipped-app'
      zipAfterPublish: true # Zips your site into a deployable package

  # 6. Save the Output to Azure DevOps
  - task: PublishPipelineArtifact@1
    displayName: 'Upload Deployable Package'
    inputs:
      targetPath: '$(Build.BinariesDirectory)/zipped-app'
      artifact: 'dotnet-web-drop'
      publishLocation: 'pipeline'

# --- Append this directly underneath your Job 6 step ---
- job: DeployToTestEnv
  displayName: 'Deploy Web App to Azure'
  dependsOn: TestAndPackageDotNet # Ensures deployment only runs if the build/tests pass!
  steps:
  
  # 1. Download the zip artifact created by the first job
  - download: current
    artifact: 'dotnet-web-drop'

  # 2. Deploy the zip directly to your Azure Web App
  - task: AzureWebApp@1
    displayName: 'Azure Web App Deploy'
    inputs:
      azureSubscription: 'pipelinedemo' # Matches the Service Connection name you just created
      appType: 'webAppLinux'
      appName: 'pipelinedemo' # Change this to match your Web App name in the Azure Portal
      package: '$(Pipeline.Workspace)/dotnet-web-drop/**/*.zip'
      